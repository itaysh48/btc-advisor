name: BTC Learn — 5min cron

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes, 24/7
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx

      - name: Run BTC worker
        run: python backend/worker.py

      - name: Commit updated state
        run: |
          git config user.name  "btc-bot[bot]"
          git config user.email "btc-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "bot: update model state [skip ci]"
          git pull --rebase origin main
          git push
